# Builds the Android APK and the Hostinger web bundle, and publishes both as
# a GitHub Release (download from the repo's "Releases" page).
#
# Runs on every push to the branches below, or by hand from the Actions tab
# ("Run workflow").
name: Build APK + web

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/crm-ten-fixes
      - claude/compassionate-cannon-91mxsr
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version
        id: ver
        run: |
          v=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${v##*+}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build web for Hostinger (/atscrm/)
        # Mirrors scripts/prepare_hostinger_upload.ps1: no service worker,
        # cache-busted main.dart.js, .htaccess and version.json.
        run: |
          flutter build web --release --base-href=/atscrm/ --pwa-strategy=none
          build_id=$(date -u +%Y%m%d%H%M%S)
          out=atsleadtracker-web-upload
          rm -rf "$out" && cp -r build/web "$out"
          cp scripts/hostinger.htaccess "$out/.htaccess"
          printf '{"app_name":"atsleadtracker","version":"%s","build_number":"%s","build_id":"%s","package_name":"atsleadtracker"}\n' \
            "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.build }}" "$build_id" > "$out/version.json"
          echo "$build_id" > "$out/.last_build_id"
          sed -i -E 's/_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{\s*serviceWorkerVersion:\s*"[0-9]+"\s*\}\s*\}\);/_flutter.loader.load({});/' "$out/flutter_bootstrap.js"
          sed -i "s/\"mainJsPath\":\"main\.dart\.js\"/\"mainJsPath\":\"main.dart.js?v=$build_id\"/" "$out/flutter_bootstrap.js"
          (cd "$out" && zip -qr "../ATS-CRM-web-v${{ steps.ver.outputs.name }}.zip" .)

      - name: Name artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "ATS-CRM-v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.build }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ats-crm-v${{ steps.ver.outputs.name }}
          path: |
            ATS-CRM-v*.apk
            ATS-CRM-web-v*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.build }}-${{ github.run_number }}
          name: ATS CRM v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.build }}) — ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          body: |
            Branch `${{ github.ref_name }}`, commit ${{ github.sha }}.

            - **ATS-CRM-v…apk** — install on Android phones.
            - **ATS-CRM-web-v…zip** — unzip and upload the contents to Hostinger `public_html/atscrm/`.

            Firestore rules and Cloud Functions are not deployed by this build; run
            `firebase deploy --only firestore:rules,functions` from the repo.
          files: |
            ATS-CRM-v*.apk
            ATS-CRM-web-v*.zip
